<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0efec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="build" content="12">
<!-- Home-screen install: opens standalone (no browser bars), own icon. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roost">
<meta name="mobile-web-app-capable" content="yes">
<title>Roost</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪺</text></svg>">
<style>
  /* ---------------------------------------------------------------------------
     Braun, by way of Rams. One ground, one accent, hairlines instead of boxes,
     and nothing on the screen that isn't carrying information. The money is the
     only thing allowed to be loud: everything else is set in greys so the eye
     goes to the number first. Light by default, neutral graphite after dark,
     because a paper-white money app at 11pm is a design that stopped thinking
     about the person holding it.
  --------------------------------------------------------------------------- */
  :root{
    --bg:#f0efec; --panel:#f7f7f5; --sunk:#e7e5e1;
    --line:#d7d5d0; --line2:#c4c1bb;
    --ink:#16161a; --ink2:#6d6c68; --ink3:#9b9995;
    /* Braun's colours, used the way Braun used them: never as decoration, only
       to say something. Yellow marks the reference, green means you are fine,
       orange means act, red is reserved for the one key that destroys work. */
    --accent:#e0561d;            /* orange: attention, over budget */
    --warn:#e8a300;              /* yellow: the reference mark, spending fast */
    --good:#2f7d4f;              /* green: on track, under */
    --info:#26588f;              /* blue: a fourth series, nothing more */
    --red:#c02f22;
    --key:#e8e6e2; --keydn:#dbd8d3;
    --tabbar:70px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151515; --panel:#1d1d1d; --sunk:#101010;
      --line:#2c2c2c; --line2:#3a3a3a;
      --ink:#eeece8; --ink2:#9c9a96; --ink3:#6f6d69;
      --accent:#f26a22;
      --warn:#f0b52a;
      --good:#5aa877;
      --info:#5b8fc9;
      --red:#e0513f;
      --key:#242424; --keydn:#2f2f2f;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.45;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:14px 20px 40px}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
    letter-spacing:-.01em}

  /* labels: the only uppercase in the app, and only for naming a block */
  .cap{color:var(--ink3);font-size:10px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;margin:18px 0 7px}
  .cap:first-child{margin-top:0}

  /* a "card" is a ruled band, not a floating box */
  .card{background:none;border:none;border-top:1px solid var(--line);
    padding:12px 0;margin:0}
  .card + .card{border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .muted{color:var(--ink2);font-size:13px}
  .tiny{color:var(--ink3);font-size:12px}
  .big{font-size:40px;font-weight:400;letter-spacing:-.03em;line-height:1.05}
  .val{font-size:19px;font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
  .pos{color:var(--good)} .neg{color:var(--accent)}
  .gold{color:var(--accent)} .blue{color:var(--ink)}
  .grade{font-size:42px;font-weight:500;line-height:1}
  .pill{display:inline-block;padding:1px 7px;font-size:11px;
    border:1px solid var(--line2);color:var(--ink2)}

  /* progress: a rule that fills, never a rounded pill */
  .bar{height:3px;background:var(--line);margin-top:10px;position:relative}
  .bar>i{display:block;height:100%;background:var(--ink)}
  .bar.s0>i{background:var(--warn)}    .bar.s1>i{background:var(--accent)}
  .bar.s2>i{background:var(--good)}    .bar.s3>i{background:var(--info)}
  .bar.s4>i{background:var(--red)}     .bar.s5>i{background:var(--ink2)}
  .bar.tall{height:5px}
  .bar>u{position:absolute;top:-3px;width:1px;height:9px;background:var(--ink2)}

  .note{border-left:2px solid var(--ink2);padding:2px 0 2px 12px}
  .note.bad{border-color:var(--accent)} .note.good{border-color:var(--good)}

  button{font:inherit;color:inherit}
  .btn{width:100%;padding:15px;border:none;background:var(--ink);color:var(--bg);
    font-weight:600;font-size:15px;letter-spacing:.02em}
  input,select{width:100%;padding:12px;border:1px solid var(--line2);
    background:var(--panel);color:var(--ink);font-size:16px;margin-bottom:10px;
    border-radius:0;-webkit-appearance:none;appearance:none}
  input:focus,select:focus{outline:none;border-color:var(--ink)}

  #login{padding-top:14vh}
  .brand{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
  .err{color:var(--accent);font-size:13px;min-height:18px}
  .foot{color:var(--ink3);font-size:11px;text-align:center;margin-top:32px}
  a{color:var(--ink2)}

  /* ---- chrome ---- */
  #app{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom))}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line)}
  .topbar-in{max-width:520px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title{font-size:15px;font-weight:600;letter-spacing:.01em}
  .refresh{background:none;border:none;color:var(--ink3);font-size:12px;
    min-height:36px;padding:0 2px;letter-spacing:.06em;text-transform:uppercase}
  .spin{animation:sp .8s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  .tab{background:none;border:none;color:var(--ink3);min-height:var(--tabbar);
    padding:10px 2px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;font-size:10px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase}
  .tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--ink)}
  .dot{position:absolute;transform:translate(14px,-10px);width:6px;height:6px;
    border-radius:50%;background:var(--accent)}

  /* ---- Spend ---- */
  .weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:0 0 8px}
  .weekbar button{background:none;border:none;color:var(--ink2);min-width:44px;
    min-height:36px;font-size:20px;line-height:1}
  .weekbar button[disabled]{opacity:.25}
  .weekbar .lbl{flex:1;text-align:center;color:var(--ink3);font-size:10px;
    font-weight:600;letter-spacing:.14em;text-transform:uppercase}

  /* A solid square of the state colour, the way a Braun dial marks its setting. */
  .mark{display:inline-block;width:11px;height:11px;margin-right:9px;
    vertical-align:-1px;background:var(--ink3)}
  .mark.good{background:var(--good)} .mark.warn{background:var(--warn)}
  .mark.bad{background:var(--accent)}
  .verdict{margin-top:10px;font-size:13px;color:var(--ink2)}
  .verdict b{color:var(--ink);font-weight:600}
  .verdict .lead{color:var(--ink);font-size:15px;font-weight:500;display:block;
    margin-bottom:2px}

  .amtrow{display:flex;align-items:center;gap:6px;background:var(--sunk);
    border:1px solid var(--line);padding:2px 14px;margin-top:4px}
  .amtrow .cur{font-size:20px;color:var(--ink2);font-weight:400}
  #amt{font-size:32px;font-weight:400;letter-spacing:-.02em;border:none;
    background:none;padding:10px 0;margin:0;width:100%}
  #amt:focus{outline:none}

  /* Chips take the width of their own name. A strict grid is tidier on paper and
     worse in the hand: equal cells waste half a row on "Gift" and push the rest
     out of reach. More of them, in less space, wins. */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
    flex:0 0 auto;width:auto;min-height:40px;font-size:13px;font-weight:500;
    padding:0 13px;line-height:1.2}
  .chip:active{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.add{color:var(--accent);border-style:dashed}
  .grouphead{width:100%;color:var(--ink3);font-size:10px;font-weight:600;
    letter-spacing:.14em;padding:8px 0 2px}

  details.more>summary{list-style:none;color:var(--ink2);font-size:12px;
    padding:12px 0;cursor:pointer;letter-spacing:.02em}
  details.more>summary::-webkit-details-marker{display:none}

  .entryrow{display:flex;gap:8px;margin-top:8px}
  .entryrow>input{margin:0;font-size:14px;padding:11px 12px;flex:1 1 auto;
    width:auto;min-width:0}
  .entryrow>input.datepill,.entryrow>button{flex:0 0 auto;width:auto}
  .datepill{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
    padding:0 12px;min-height:44px;font-size:13px;white-space:nowrap}

  /* ---- the log ---- */
  .daysep{color:var(--ink3);font-size:10px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;margin:20px 0 0;padding-bottom:6px;
    border-bottom:1px solid var(--line)}
  .ent{display:flex;align-items:center;gap:12px;padding:12px 0;
    border-bottom:1px solid var(--line)}
  .ent.tap{cursor:pointer}
  .ent .x{background:none;border:none;color:var(--ink3);font-size:15px;
    padding:6px 0 6px 8px;line-height:1;flex:none}
  .src{display:inline-block;border:1px solid var(--info);padding:0 6px;
    font-size:10px;color:var(--info);margin-left:7px;vertical-align:1px;
    letter-spacing:.04em}

  .editrow{background:var(--panel);border:1px solid var(--ink);padding:14px;
    margin:10px 0}
  .editrow select{margin-top:8px;margin-bottom:0}
  .editrow .acts{display:flex;gap:1px;margin-top:12px;background:var(--line2);
    border:1px solid var(--line2)}
  .editrow .acts button{flex:1;min-height:44px;font-size:13px;font-weight:600;
    border:none;background:var(--panel);color:var(--ink)}
  .editrow .acts .save{background:var(--ink);color:var(--bg)}
  .editrow .acts .del{color:var(--accent)}

  /* ---- eight weeks, drawn honestly ---- */
  .hist{display:flex;align-items:flex-end;gap:5px;height:96px;position:relative;
    margin-top:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .hist .budgetline{position:absolute;left:0;right:0;border-top:1px dashed var(--warn)}
  .histcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    height:100%;background:none;border:none;padding:0;position:relative}
  .histcol i{display:block;background:var(--good);width:100%}
  .histcol i.over{background:var(--accent)}
  .histcol i.now{background:var(--ink)}
  .histcol i.now.over{background:var(--accent)}
  .histcol span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;
    font-size:9px;color:var(--ink3);letter-spacing:.04em}

  /* ---- misc ---- */
  .empty{text-align:center;color:var(--ink3);padding:36px 16px;font-size:13px}
  .empty .em{font-size:28px;display:block;margin-bottom:10px;opacity:.5}
  .acct{border-top:1px solid var(--line);padding:12px 0;margin:0}
  .acct-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding-bottom:6px}
  .acct-name{font-size:15px;font-weight:600}
  details.cardrow{margin-top:6px;border-top:1px solid var(--line)}
  details.cardrow>summary{list-style:none;cursor:pointer;padding:10px 0;
    display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
  details.cardrow>summary::-webkit-details-marker{display:none}
  .chev{transition:transform .15s;color:var(--ink3);flex:none}
  details[open]>summary .chev{transform:rotate(90deg)}
  .lines{padding:0 0 8px}
  .line{display:flex;align-items:center;gap:10px;padding:7px 0;
    border-top:1px solid var(--line);font-size:12px}
  .line .d{color:var(--ink3);font-size:11px;min-width:42px}
  .line .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #installbar{max-width:520px;margin:12px auto 0;padding:0 20px}
  #installbar .card{display:flex;align-items:center;gap:12px;border-top:none;
    border-left:2px solid var(--accent);padding:10px 0 10px 12px}
  #installbar .go{background:var(--ink);color:var(--bg);border:none;
    padding:10px 14px;font-weight:600;font-size:13px;flex:none}
  #installbar .no{background:none;border:none;color:var(--ink3);font-size:18px;
    padding:2px 4px;flex:none}
  #diagout .card{text-align:left}
  #diagout .row{padding:5px 0;font-size:12px;align-items:flex-start}
  #diagout .v{text-align:right;font-weight:600;color:var(--ink)}
  #diagout .v.n{color:var(--accent)}

  .toast{position:fixed;left:20px;right:20px;max-width:480px;margin:0 auto;
    bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 12px);z-index:40;
    background:var(--ink);color:var(--bg);border:none;padding:13px 16px;
    display:flex;align-items:center;gap:16px;font-size:13px}
  .toast button{background:none;border:none;color:var(--bg);font-weight:700;
    font-size:13px;padding:2px;text-decoration:underline}
  .hint{color:var(--accent);font-size:12px;min-height:16px;margin-top:8px}
</style>
</head>
<body>

<div class="wrap" id="login">
  <div class="brand">Roost</div>
  <div class="muted" style="margin-bottom:18px">Sign in once — this device stays signed in.</div>
  <input id="email" type="email" autocomplete="username" placeholder="Email" inputmode="email">
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
  <div class="err" id="err"></div>
  <button class="btn" id="go">Sign in</button>
</div>

<div id="app" style="display:none">
  <div class="topbar"><div class="topbar-in">
    <div class="title" id="ttl">Home</div>
    <button class="refresh" id="rf">Refresh</button>
  </div></div>

  <div id="installbar" style="display:none"><div class="card">
    <div style="flex:1">
      <b style="font-size:14px">Install Roost</b>
      <div class="tiny">This is running in the browser. Installing gives it its own
        icon with no address bar.</div>
    </div>
    <button class="go" id="doinstall">Install</button>
    <button class="no" id="noinstall" aria-label="Not now">&times;</button>
  </div></div>

  <div class="wrap">
    <div id="content"><div class="card">Loading your numbers…</div></div>
    <div class="foot">
      Read-only viewer &middot; <span id="stamp"></span><br>
      <a href="#" id="diag">App status</a> &middot; <a href="#" id="out">Sign out</a>
    </div>
    <div id="diagout"></div>
  </div>

  <nav class="tabbar"><div class="tabbar-in" id="tabs"></div></nav>
</div>

<script>
// Register the service worker. Without one Android Chrome will not offer a real
// install, and "Add to Home screen" produces a bookmark that opens in a browser
// tab with the address bar. Wrapped and deferred so it can never delay or break
// sign-in — the app works fine if this fails.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// Chrome fires beforeinstallprompt early — often before the module below has
// finished loading — and the event is only usable if it was captured. Stash it
// here; the module picks it up and shows the Install bar.
window.__installEvt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();                    // keep Chrome's own mini-infobar away
  window.__installEvt = e;
  if (window.__onInstallable) window.__onInstallable();
});

// Fail-safe: if the module below never runs (CDN blocked, old browser, syntax
// error) the sign-in form is already visible, and this surfaces the reason
// instead of leaving a blank screen.
window.addEventListener("error", e => {
  const err = document.getElementById("err");
  if (err && !err.textContent) err.textContent = "Load error: " + (e.message || "script failed");
});
setTimeout(() => {
  const err = document.getElementById("err");
  if (err && !window.__roostReady && !err.textContent) {
    err.textContent = "Still loading… if this persists, check your connection.";
  }
}, 6000);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache,
         persistentMultipleTabManager,
         collection, getDocs, doc, getDoc, setDoc, deleteDoc, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCYUzGLKGVUe13t5L1NBfBLHryKuc2_FYk",
  authDomain: "roost-d123c.firebaseapp.com",
  projectId: "roost-d123c",
});
const auth = getAuth(app);
// Persistent cache so a purchase logged in a store with no signal is queued and
// sent when the phone reconnects, instead of being lost. Falls back to the plain
// in-memory client if the browser refuses (private mode, old WebView) — a failure
// here must never cost him the app.
let db;
try {
  // Multi-tab manager: with the single-tab default, a second open tab fails to
  // take the lease and its first read throws.
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
  });
} catch (e) {
  db = getFirestore(app);
}

const $ = id => document.getElementById(id);
const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n)).toLocaleString();
const money2 = n => (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString(undefined,
  {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- auth ----
$("go").onclick = async () => {
  $("err").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value);
  } catch (e) {
    $("err").textContent = /invalid|password|credential/i.test(e.code || "")
      ? "Wrong email or password." : "Couldn't sign in. Check your connection.";
  }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
$("out").onclick = async e => { e.preventDefault(); await signOut(auth); location.reload(); };

// Toggle with explicit values — "" would fall back to any CSS rule and could
// leave both panels hidden (that bug shipped once; don't reintroduce it).
function show(which) {
  $("login").style.display = which === "login" ? "block" : "none";
  $("app").style.display   = which === "app"   ? "block" : "none";
}

// No top-level await anywhere — older phone browsers / WebViews fail to parse
// the whole module if it's present, which would break sign-in entirely.
(function start() {
  const go = () => onAuthStateChanged(auth, user => {
    window.__roostReady = true;    // tells the fail-safe timer we got this far
    if (user) { show("app"); load(); }
    else { show("login"); }
  });
  // Persist the session so it's a one-time sign-in; never let it block sign-in.
  try {
    const p = setPersistence(auth, browserLocalPersistence);
    (p && p.then) ? p.then(go, go) : go();
  } catch (e) { go(); }
})();

// ---- tabs ----
// One long scroll meant hunting for everything. Four thumb-reachable tabs, with
// the last one you used remembered between visits.
const ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/>',
  accounts: '<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/>',
  ada: '<path d="M12 21s-7.5-4.7-7.5-10A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 7.5 3c0 5.3-7.5 10-7.5 10z"/>',
  plan: '<path d="M4 19V5"/><path d="M4 15l5-4 4 3 7-6"/>',
  spend: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v9"/><path d="M9.5 15h4a1.75 1.75 0 0 0 0-3.5h-3a1.75 1.75 0 0 1 0-3.5h4"/>',
};
const TABS = [
  {key:"spend",    label:"Spend",    title:"Spend"},
  {key:"home",     label:"Home",     title:"Home"},
  {key:"accounts", label:"Accounts", title:"Accounts"},
  {key:"ada",      label:"Ada",      title:"Ada's Debt"},
  {key:"plan",     label:"Plan",     title:"Plan & Spending"},
];
let TAB = "spend";
try {
  TAB = localStorage.getItem("roostTab") || "spend";
  // Spend became the main screen in build 11. Land him there once, whatever tab
  // he happened to leave open months ago, then respect his choice again.
  if (!localStorage.getItem("roostSpendFirst")) {
    TAB = "spend";
    localStorage.setItem("roostSpendFirst", "1");
  }
} catch (e) {}
if (!TABS.some(t => t.key === TAB)) TAB = "spend";

let SNAP = null, ACCOUNTS = [];
let SPEND = [], CATS = [], BUDGET = 0, WEEK_START = 0;

function paintTabs() {
  $("tabs").innerHTML = TABS.map(t => {
    const on = t.key === TAB;
    const badge = (t.key === "ada" && (SNAP?.ada?.total || 0) > 0.005)
      ? '<span class="dot"></span>' : "";
    return `<button class="tab" role="tab" aria-selected="${on}" data-tab="${t.key}">
      <svg viewBox="0 0 24 24">${ICON[t.key]}</svg>${badge}
      <span>${esc(t.label)}</span></button>`;
  }).join("");
  for (const b of $("tabs").querySelectorAll(".tab")) {
    b.onclick = () => selectTab(b.dataset.tab);
  }
}

function selectTab(key) {
  TAB = key;
  try { localStorage.setItem("roostTab", key); } catch (e) {}
  paintTabs();
  paint();
  window.scrollTo({top:0, behavior:"instant"});
}

function paint() {
  const t = TABS.find(x => x.key === TAB) || TABS[0];
  $("ttl").textContent = t.title;
  $("content").innerHTML = renderTab(TAB, SNAP, ACCOUNTS);
  if (TAB === "spend") wireSpend();      // innerHTML wiped the old listeners
}

// ---- load ----
async function load() {
  const btn = $("rf");
  btn.innerHTML = '<span class="spin">↻</span>';
  try {
    // Only the last ~4 months of the log — enough for the 4-week stats with room
    // to spare, and it keeps the read small as the log grows year over year.
    const since = isoDate(addDays(new Date(), -120));
    const [snapDoc, acctSnap, setDocSnap, logSnap, catSnap] = await Promise.all([
      getDoc(doc(db, "meta", "phone_snapshot")),
      getDocs(collection(db, "accounts")),
      getDoc(doc(db, "meta", "spend_settings")),
      getDocs(query(collection(db, "spend_log"), where("date", ">=", since))),
      getDocs(collection(db, "categories")),
    ]);
    SNAP = snapDoc.exists() ? snapDoc.data() : null;
    ACCOUNTS = acctSnap.docs.map(d => d.data());
    const st = setDocSnap.exists() ? setDocSnap.data() : {};
    BUDGET = +st.weekly_budget || 0;
    WEEK_START = Number.isInteger(st.week_start) ? st.week_start : 0;   // 0 = Sunday
    SPEND = logSnap.docs.map(d => ({ ...d.data(), _id: d.id }));
    CATS = catSnap.docs.map(d => d.data()).filter(c => c && c.name);
    paintTabs();
    paint();
    $("stamp").textContent = SNAP?.generated
      ? "updated " + new Date(SNAP.generated).toLocaleString(undefined,
          {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})
      : "no snapshot yet";
  } catch (e) {
    $("content").innerHTML =
      `<div class="card"><b>Couldn't load your data.</b><div class="muted"
       style="margin-top:6px">${esc(e.message || e)}</div></div>`;
  }
  btn.textContent = "Refresh";
}
$("rf").onclick = () => load();

// ---- render ----
function renderTab(tab, s, accounts) {
  accounts = accounts || [];
  if (tab === "spend")    return viewSpend();
  if (tab === "accounts") return viewAccounts(s, accounts);
  if (tab === "ada")      return viewAda(s);
  if (tab === "plan")     return viewPlan(s);
  return viewHome(s, accounts);
}

const isDebt = a => a.type === "Credit Card" || a.type === "Loan";
const sumBal = xs => xs.reduce((t, a) => t + (+a.balance || 0), 0);

function noSnap() {
  return `<div class="card"><b>No snapshot yet.</b><div class="muted" style="margin-top:6px">
    Open Roost on your PC once — it publishes the numbers this viewer reads.</div></div>`;
}

function viewHome(s, accounts) {
  const assets = accounts.filter(a => !isDebt(a));
  const debts  = accounts.filter(a =>  isDebt(a));
  const netWorth = s ? s.net_worth : sumBal(assets) - sumBal(debts);
  let h = `<div class="cap">NET WORTH</div>
    <div class="big ${netWorth < 0 ? "neg" : ""} mono">${money(netWorth)}</div>

  const net = s.net ?? 0;
  h += `<div class="cap">${esc(monthName(s.month_label))} — LAST FULL MONTH</div>
    <div class="grid2">
      <div class="card"><div class="tiny">FREE</div>
        <div class="val ${net >= 0 ? "pos" : "neg"} mono">${net >= 0 ? "+" : "-"}${money(Math.abs(net))}</div>
        <div class="tiny">after ${money(s.saved || 0)} saved</div></div>

    h += `<div class="card"><div class="row">
        <div><div class="tiny">HEALTH</div><div class="grade ${gc}">${esc(s.grade)}</div></div>
        <div style="flex:1;text-align:right">

            `<div class="tiny" style="color:${f.ok ? "var(--accent-hi)" : "var(--muted)"}">
               ${f.ok ? "✓" : "•"} ${esc(f.name)} — ${esc(f.detail)}</div>`).join("")}

  const debts  = accounts.filter(a =>  isDebt(a)).sort((x,y)=>(+y.balance||0)-(+x.balance||0));
  if (!accounts.length) {

// Ada's ledger, grouped by HER account with each card nested under it — the same

// ---- spend log: the weekly tally --------------------------------------------
// Deliberately its OWN ledger, in `spend_log`. It never writes a transaction and
// never feeds cash flow, net worth or the payoff math - so when the bank
// statement lands weeks later and imports the same purchase, nothing can be
// counted twice. This is the running total that keeps the week honest; the
// desktop stays the source of truth for what actually left the account.

function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function isoDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
    + "-" + String(d.getDate()).padStart(2, "0");
}
function weekStartOf(d) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() - WEEK_START + 7) % 7));
  return x;
}
const dayLabel = iso => {
  const [y, m, dd] = iso.split("-").map(Number);
  return new Date(y, m - 1, dd).toLocaleDateString(undefined,
    { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
};
const spanLabel = (a, b) => {
  const f = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return f(a) + " to " + f(b);
};
const between = (iso, a, b) => iso >= a && iso <= b;
const sumOf = xs => xs.reduce((t, e) => t + (+e.amount || 0), 0);

// Kept outside the render so a re-render never eats what he is typing.
let DRAFT = { amt: "", note: "", date: "" };
let NEWCAT = false;
let WEEK_OFF = 0;      // 0 = this week, -1 = last week, ...
let EDIT_ID = null;    // the row being corrected, if any

// The starters only matter until he has logged anything; after that his own
// habits order the chips.
const STARTER_CATS = ["Groceries", "Restaurants", "Fuel", "Coffee", "Fast Food",
                      "Household", "General/Amazon", "Entertainment"];

function topCategories(n) {
  const since = isoDate(addDays(new Date(), -60));
  const count = {};
  for (const e of SPEND) if (e.date >= since && e.category)
    count[e.category] = (count[e.category] || 0) + 1;
  const out = Object.keys(count).sort((a, b) => count[b] - count[a]);
  for (const c of STARTER_CATS) if (out.length < n && !out.includes(c)) out.push(c);
  return out.slice(0, n);
}

function byCategory(entries) {
  const t = {};
  for (const e of entries) {
    const k = e.category || "Uncategorized";
    t[k] = (t[k] || 0) + (+e.amount || 0);
  }
  return Object.entries(t).map(([category, amount]) => ({ category, amount }))
    .sort((a, b) => b.amount - a.amount);
}

function weekBounds(off) {
  const ws = addDays(weekStartOf(new Date()), off * 7);
  const we = addDays(ws, 6);
  return { ws, we, wsI: isoDate(ws), weI: isoDate(we) };
}

const inWeek = (wsI, weI) => SPEND.filter(e => between(e.date, wsI, weI));

/// Overspend rolls forward. A week that ends over its budget takes the overage
/// out of the next week, and it keeps taking it until a lean week clears it.
/// Debt direction only (his call): coming in under does not bank anything, and
/// nothing is ever forgiven, so the number always matches what he actually spent.
function carryInto(wsI) {
  if (!(BUDGET > 0) || !SPEND.length) return 0;
  const earliest = SPEND.reduce((m, e) => (e.date < m ? e.date : m), SPEND[0].date);
  let d = weekStartOf(new Date(earliest + "T00:00:00"));
  let carry = 0;
  for (let guard = 0; isoDate(d) < wsI && guard < 400; guard++) {
    const a = isoDate(d), b = isoDate(addDays(d, 6));
    carry = Math.max(0, sumOf(inWeek(a, b)) - (BUDGET - carry));
    d = addDays(d, 7);
  }
  return Math.round(carry * 100) / 100;
}

const allCategories = () => {
  const names = new Set(CATS.map(c => c.name).filter(Boolean));
  for (const e of SPEND) if (e.category) names.add(e.category);
  return [...names].sort();
};

/// How the week is going, in words. Two lines at most: what it is, and whether
/// that is better or worse than the same point last week. Same point, not the
/// whole week, because "you have spent less than a full week" on a Tuesday is
/// flattery, not feedback.
function verdictFor(spent, budget, elapsed, thisWeek, tail) {
  const prev = weekBounds(WEEK_OFF - 1);
  const cutoff = isoDate(addDays(prev.ws, Math.max(0, elapsed - 1)));
  const prevRows = inWeek(prev.wsI, prev.weI);
  const prevSame = sumOf(prevRows.filter(e => e.date <= cutoff));
  const diff = spent - prevSame;

  let lead, tone = "";
  if (budget <= 0) {
    lead = spent > 0 ? "No budget set." : "Nothing logged.";
  } else if (spent > budget) {
    lead = "Over budget.";
    tone = "bad";
  } else if (!thisWeek) {
    lead = money2(budget - spent) + " under.";
    tone = "good";
  } else if (spent > budget * (elapsed / 7)) {
    lead = "Spending fast.";
    tone = "warn";
  } else {
    lead = "On track.";
    tone = "good";
  }

  const mark = { good: "good", warn: "warn", bad: "bad" }[tone] || "";
  let h = `<div class="verdict"><span class="lead"><i class="mark ${mark}"></i>${esc(lead)}</span>`;
  if (prevRows.length) {
    h += Math.abs(diff) < 0.005
      ? `Level with last week${thisWeek ? " at this point" : ""}.`
      : `<b>${money2(Math.abs(diff))}</b> ${diff < 0 ? "less" : "more"} than last
         week${thisWeek ? " by this day" : ""}.`;
  } else {
    h += `Nothing logged last week to compare against.`;
  }
  const run = underStreak();
  if (run >= 2) h += ` ${run} weeks under in a row.`;
  if (tail) h += ` ${tail}`;
  return h + `</div>`;
}

/// Completed weeks, newest first, that came in at or under their own budget.
function underStreak() {
  if (!(BUDGET > 0)) return 0;
  let n = 0;
  for (let i = 1; i <= 12; i++) {
    const b = weekBounds(WEEK_OFF - i);
    const rows = inWeek(b.wsI, b.weI);
    if (!rows.length) break;
    if (sumOf(rows) > BUDGET - carryInto(b.wsI)) break;
    n++;
  }
  return n;
}

/// Eight weeks against the budget line. No axes, no gridlines, no legend: the
/// dashed rule is the budget and anything crossing it is drawn in the one colour
/// this app uses to mean trouble.
function history() {
  const cols = [];
  for (let i = 7; i >= 0; i--) {
    const b = weekBounds(WEEK_OFF - i);
    cols.push({
      off: WEEK_OFF - i,
      tot: sumOf(inWeek(b.wsI, b.weI)),
      bud: BUDGET > 0 ? BUDGET - carryInto(b.wsI) : 0,
      label: (b.ws.getMonth() + 1) + "/" + b.ws.getDate(),
    });
  }
  if (!cols.some(c => c.tot > 0)) return "";
  const H = 96;
  const max = Math.max(BUDGET, ...cols.map(c => c.tot)) * 1.12 || 1;
  const line = BUDGET > 0 ? Math.round(BUDGET / max * H) : 0;

  let h = `<div class="cap">EIGHT WEEKS</div><div class="hist">`;
  if (line > 0) h += `<div class="budgetline" style="bottom:${18 + line}px"></div>`;
  for (const c of cols) {
    const px = Math.max(c.tot > 0 ? 2 : 0, Math.round(c.tot / max * H));
    const cls = c.off === 0 ? "now" : (c.bud > 0 && c.tot > c.bud ? "over" : "");
    h += `<button class="histcol" data-week="${c.off}" aria-label="${esc(c.label)}">
        <i class="${cls}" style="height:${px}px"></i>
        <span>${esc(c.label)}</span></button>`;
  }
  return h + `</div>`;
}

function viewSpend() {
  const today = new Date();
  const { ws, we, wsI, weI } = weekBounds(WEEK_OFF);
  const week = inWeek(wsI, weI);
  const spent = sumOf(week);
  const carry = carryInto(wsI);
  const budget = BUDGET > 0 ? BUDGET - carry : 0;
  const left = budget - spent;
  const thisWeek = WEEK_OFF === 0;
  const elapsed = thisWeek
    ? Math.min(7, Math.round((new Date(isoDate(today) + "T00:00:00") - ws) / 86400000) + 1)
    : 7;
  const daysLeft = 7 - elapsed;

  // ---- where the week stands ----
  let h = `<div class="weekbar">
      <button id="wprev" aria-label="Previous week">&#8249;</button>
      <span class="lbl">${esc(spanLabel(ws, we))}</span>
      <button id="wnext" aria-label="Next week" ${thisWeek ? "disabled" : ""}>&#8250;</button>
    </div>
    <div class="big mono ${budget > 0 && left < 0 ? "neg" : ""}">${money2(spent)}</div>`;

  if (budget > 0) {
    const pct = Math.min(100, Math.round(spent / budget * 100));
    const state = left < 0 ? "bad"
      : (thisWeek && spent > budget * (elapsed / 7)) ? "warn" : "good";
    const paint = { good: "var(--good)", warn: "var(--warn)", bad: "var(--accent)" }[state];
    h += `<div class="muted" style="margin-top:2px">of ${money2(budget)} &middot;
        <b class="${left < 0 ? "neg" : "pos"}">${left < 0 ? money2(-left) + " over"
                                                          : money2(left) + " left"}</b></div>
      <div class="bar tall"><i style="width:${pct}%;background:${paint}"></i>${
        thisWeek ? `<u style="left:${Math.round(elapsed / 7 * 100)}%"></u>` : ""}</div>`;
  } else {
    h += `<div class="muted" style="margin-top:2px">no weekly budget set</div>`;
  }

  let tail = "";
  if (budget > 0 && thisWeek && left > 0 && daysLeft >= 0) {
    tail = `${money2(left / (daysLeft + 1))} a day for the ${daysLeft + 1}
      day${daysLeft === 0 ? "" : "s"} left.`;
  } else if (budget > 0 && left < 0 && thisWeek) {
    tail = `<b class="neg">Next week starts at ${money2(BUDGET + left)}.</b>`;
  }
  h += verdictFor(spent, budget, elapsed, thisWeek, tail);

  if (carry > 0) {
    h += `<div class="note bad" style="margin-top:10px">
        <div class="tiny">The week before went over by ${money2(carry)}, so this one
          is ${money2(budget)} instead of ${money2(BUDGET)}.</div></div>`;
  }
  // ---- the thing he actually opens the app to do ----
  // The amount field and the chips, unchanged. An on-page keypad was tried here
  // and was worse to use in every way; the phone's own keyboard stays.
  h += `<div class="cap">LOG A PAYMENT</div>
    <div class="amtrow"><span class="cur">$</span>
      <input id="amt" inputmode="decimal" placeholder="0.00" value="${esc(DRAFT.amt)}"></div>
    <div class="entryrow">
      <input id="note" placeholder="Note (optional)" value="${esc(DRAFT.note)}">
      <input class="datepill" type="date" id="dinp" value="${esc(DRAFT.date || defaultDate())}">
    </div>
    <div class="hint" id="hint"></div>
    <div class="chips">`;
  for (const c of topCategories(10)) {
    h += `<button class="chip" data-cat="${esc(c)}">${esc(c)}</button>`;
  }
  h += `<button class="chip add" id="newcat">+ New</button></div>`;
  if (NEWCAT) {
    h += `<div class="entryrow">
        <input id="catname" placeholder="New category name" autocomplete="off">
        <button class="datepill" id="catsave">Add</button>
      </div>`;
  }

  const groups = {};
  for (const c of CATS) {
    const g = c.group || "Other";
    (groups[g] = groups[g] || []).push(c.name);
  }
  const groupNames = Object.keys(groups).sort();
  if (groupNames.length) {
    h += `<details class="more"><summary>All categories</summary><div class="chips">`;
    for (const g of groupNames) {
      h += `<div class="grouphead">${esc(g.toUpperCase())}</div>`;
      for (const name of groups[g].slice().sort()) {
        h += `<button class="chip" data-cat="${esc(name)}">${esc(name)}</button>`;
      }
    }
    h += `</div></details>`;
  }
  h += `<div class="tiny" style="margin-top:10px">Type the amount, tap a category.
    Tap anything you've logged to fix it. This is your own tally, it doesn't touch
    your accounts, net worth or the payoff plan.</div>`;

  // ---- the log itself ----
  if (week.length) {
    h += `<div class="cap">${thisWeek ? "THIS WEEK" : "THAT WEEK"}</div>`;
    const days = [...new Set(week.map(e => e.date))].sort().reverse();
    for (const d of days) {
      const rows = week.filter(e => e.date === d)
        .sort((a, b) => String(b.created || "").localeCompare(String(a.created || "")));
      h += `<div class="daysep">${esc(dayLabel(d))} &middot; ${money2(sumOf(rows))}</div>`;
      for (const e of rows) {
        h += e._id === EDIT_ID ? editRow(e) : `<div class="ent tap" data-edit="${esc(e._id)}">
            <b class="mono" style="min-width:76px">${money2(e.amount)}</b>
            <span style="flex:1;min-width:0">
              <span>${esc(e.category || "Uncategorized")}</span>${
                e.source === "fuelwise" ? `<span class="src">FUELWISE</span>` : ""}
              ${e.note ? `<div class="tiny">${esc(e.note)}</div>` : ""}
            </span>
            <span class="x" aria-hidden="true">&rsaquo;</span>
          </div>`;
      }
    }

    const cats = byCategory(week);
    const peak = cats[0].amount || 1;
    h += `<div class="cap">WHERE IT WENT</div>`;
    cats.forEach((c, i) => {
      h += `<div style="margin-bottom:12px">
          <div class="row"><span>${esc(c.category)}</span>
            <b class="mono">${money2(c.amount)}</b></div>
          <div class="bar tall s${i % 6}"><i style="width:${
            Math.round(c.amount / peak * 100)}%"></i></div>
        </div>`;
    });
  } else {
    h += `<div class="cap">${thisWeek ? "THIS WEEK" : "THAT WEEK"}</div>
      <div class="empty">Nothing logged${thisWeek ? " yet this week" : " that week"}.</div>`;
  }

  // Everything past this point is history, and history was crowding the week he
  // is actually in. One line, opened only when he wants it.
  const past4 = [];
  for (let i = 1; i <= 4; i++) {
    const b = weekBounds(WEEK_OFF - i);
    const rows = inWeek(b.wsI, b.weI);
    if (rows.length) past4.push(rows);
  }
  const hist = history();
  if (hist || past4.length) {
    h += `<details class="more"><summary>Earlier weeks</summary>` + hist;
  }

  // ---- four weeks of habit, which is where a cut actually comes from ----
  const past = past4;
  if (past.length) {
    const all = past.flat();
    const cats = byCategory(all).slice(0, 6);
    const peak = cats[0].amount || 1;
    h += `<div class="cap">WHERE TO CUT, LAST 4 WEEKS</div>`;
    cats.forEach((c, i) => {
      h += `<div style="margin-bottom:12px">
          <div class="row"><span>${esc(c.category)}</span>
            <span><b class="mono">${money2(c.amount)}</b>
              <span class="tiny"> ${money2(c.amount / past.length)}/wk</span></span></div>
          <div class="bar tall s${i % 6}"><i style="width:${
            Math.round(c.amount / peak * 100)}%"></i></div>
        </div>`;
    });
  }
  if (hist || past4.length) h += `</details>`;

  h += `<div class="cap">WEEKLY BUDGET</div>
    <div class="entryrow" style="margin-top:0">
      <input id="bud" inputmode="decimal" placeholder="0" value="${BUDGET || ""}">
      <button class="datepill" id="budsave">Save</button>
    </div>
    <div class="tiny" style="margin-top:8px">Weeks run Sunday to Saturday. Go over and
      the difference comes out of the week after.</div>`;
  return h;
}

function wireSpend() {
  const amt = $("amt"), note = $("note"), dinp = $("dinp");
  if (amt) {
    amt.oninput = () => { DRAFT.amt = amt.value; };
    amt.addEventListener("keydown", e => { if (e.key === "Enter") amt.blur(); });
  }
  if (note) note.oninput = () => { DRAFT.note = note.value; };
  if (dinp) dinp.onchange = () => { DRAFT.date = dinp.value; };

  for (const b of document.querySelectorAll("[data-cat]")) {
    b.onclick = () => logSpend(b.dataset.cat);
  }
  for (const b of document.querySelectorAll("[data-edit]")) {
    b.onclick = () => { EDIT_ID = b.dataset.edit; paint(); };
  }
  for (const b of document.querySelectorAll("[data-week]")) {
    b.onclick = () => goWeek(parseInt(b.dataset.week, 10));
  }

  const prev = $("wprev"), next = $("wnext");
  if (prev) prev.onclick = () => goWeek(WEEK_OFF - 1);
  if (next) next.onclick = () => goWeek(WEEK_OFF + 1);

  const save = $("esave"), cancel = $("ecancel"), del = $("edel");
  if (save) save.onclick = () => saveEdit();
  if (cancel) cancel.onclick = () => { EDIT_ID = null; paint(); };
  if (del) del.onclick = () => { const id = EDIT_ID; EDIT_ID = null; removeEntry(id); };

  const nc = $("newcat");
  if (nc) nc.onclick = () => { NEWCAT = !NEWCAT; paint(); const f = $("catname"); if (f) f.focus(); };
  const cs = $("catsave"), cn = $("catname");
  if (cs) cs.onclick = () => addCategory(cn ? cn.value : "");
  if (cn) cn.addEventListener("keydown", e => { if (e.key === "Enter") addCategory(cn.value); });

  const bs = $("budsave"), bud = $("bud");
  if (bs) bs.onclick = () => saveBudget(bud ? bud.value : "");
  if (bud) bud.addEventListener("keydown", e => { if (e.key === "Enter") saveBudget(bud.value); });
}

function goWeek(off) {
  if (off > 0) return;                  // there is nothing to see in the future
  WEEK_OFF = off;
  EDIT_ID = null;
  DRAFT.date = "";                      // let the new week pick the default
  paint();
  window.scrollTo({ top: 0, behavior: "instant" });
}

/// A logged payment opened for correction. Everything about it is editable,
/// because the whole point is that he mistyped something.
function editRow(e) {
  const opts = allCategories().map(n =>
    `<option value="${esc(n)}"${n === e.category ? " selected" : ""}>${esc(n)}</option>`).join("");
  return `<div class="editrow">
      <div class="entryrow" style="margin-top:0">
        <input id="eamt" inputmode="decimal" value="${e.amount}">
        <input class="datepill" type="date" id="edate" value="${esc(e.date)}">
      </div>
      <div class="entryrow">
        <input id="enote" placeholder="Note (optional)" value="${esc(e.note || "")}">
      </div>
      <select id="ecat">${opts}</select>
      <div class="acts">
        <button class="save" id="esave">Save</button>
        <button id="ecancel">Cancel</button>
        <button class="del" id="edel">Delete</button>
      </div>
      ${e.source === "fuelwise" ? `<div class="tiny" style="margin-top:8px">This came
        from FuelWise. Editing the fill-up there will overwrite this.</div>` : ""}
    </div>`;
}

/// The date a new payment defaults to: today when he is looking at this week,
/// otherwise the end of the week he is looking at, so logging into a past week
/// does not file the payment somewhere he cannot see it.
function defaultDate() {
  const { we, wsI, weI } = weekBounds(WEEK_OFF);
  const today = isoDate(new Date());
  return between(today, wsI, weI) ? today : isoDate(we);
}

function saveEdit() {
  const id = EDIT_ID;
  const e = SPEND.find(x => x._id === id);
  if (!e) { EDIT_ID = null; paint(); return; }
  const amount = Math.round(parseFloat(String($("eamt").value).replace(/[^0-9.]/g, "")) * 100) / 100;
  if (!(amount > 0)) { $("eamt").focus(); return; }
  const rec = {
    date: $("edate").value || e.date,
    amount,
    category: $("ecat").value || e.category,
    note: $("enote").value.trim(),
    created: e.created || new Date().toISOString(),
  };
  if (e.source) rec.source = e.source;
  Object.assign(e, rec);
  EDIT_ID = null;
  paint();
  setDoc(doc(db, "spend_log", id), rec)
    .catch(err => toast("Couldn't save that change: " + (err.message || err)));
  toast("Updated " + money2(amount) + " \u00b7 " + rec.category);
}

function hint(msg) {
  const el = $("hint");
  if (el) el.textContent = msg;
}



// Writes are optimistic: the list updates now and the network catches up. With
// the persistent cache an offline write is queued, so awaiting it before showing
// anything would leave him staring at a dead screen in a checkout line.
function logSpend(category) {
  const amount = Math.round(parseFloat(String(DRAFT.amt).replace(/[^0-9.]/g, "")) * 100) / 100;
  if (!(amount > 0)) {
    hint("Enter an amount first.");
    const a = $("amt"); if (a) a.focus();
    return;
  }
  const rec = {
    // defaultDate(), not today: logging while looking at a past week has to land
    // in the week he is looking at, or it vanishes from the screen he typed it on.
    date: DRAFT.date || defaultDate(),
    amount: amount,
    category: category,
    note: (DRAFT.note || "").trim(),
    created: new Date().toISOString(),
  };
  const ref = doc(collection(db, "spend_log"));
  SPEND.push({ ...rec, _id: ref.id });
  DRAFT.amt = ""; DRAFT.note = "";
  NEWCAT = false;
  paint();
  setDoc(ref, rec).catch(e => toast("Couldn't save that: " + (e.message || e)));
  toast("Logged " + money2(amount) + " · " + category, "Undo", () => removeEntry(ref.id));
}

function removeEntry(id) {
  SPEND = SPEND.filter(e => e._id !== id);
  paint();
  deleteDoc(doc(db, "spend_log", id))
    .catch(e => toast("Couldn't delete that: " + (e.message || e)));
}

// New categories go into the SAME `categories` collection the desktop uses, in
// the desktop's own shape, so one list serves both and the stats line up.
function addCategory(raw) {
  const name = String(raw || "").trim();
  if (!name) { hint("Name the category first."); return; }
  const existing = CATS.find(c => (c.name || "").toLowerCase() === name.toLowerCase());
  if (!existing) {
    const id = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const cat = { id: id, name: name, group: "Other", custom: true };
    CATS.push(cat);
    setDoc(doc(db, "categories", id), cat)
      .catch(e => toast("Couldn't save the category: " + (e.message || e)));
  }
  NEWCAT = false;
  const amount = parseFloat(String(DRAFT.amt).replace(/[^0-9.]/g, ""));
  if (amount > 0) logSpend(existing ? existing.name : name);  // amount typed: log it now
  else paint();                                               // otherwise just keep the chip
}

function saveBudget(raw) {
  const v = Math.round(parseFloat(String(raw).replace(/[^0-9.]/g, "")) * 100) / 100;
  if (!(v >= 0)) return;
  BUDGET = v;
  paint();
  setDoc(doc(db, "meta", "spend_settings"),
         { weekly_budget: v, week_start: WEEK_START }, { merge: true })
    .catch(e => toast("Couldn't save the budget: " + (e.message || e)));
  toast("Weekly budget " + money(v));
}

let TOAST_T = null;
function toast(msg, actionLabel, action) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  if (TOAST_T) clearTimeout(TOAST_T);
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel) {
    const b = document.createElement("button");
    b.textContent = actionLabel;
    b.onclick = () => { el.remove(); if (action) action(); };
    el.appendChild(b);
  }
  document.body.appendChild(el);
  TOAST_T = setTimeout(() => el.remove(), 6000);
}

// ---- install ----------------------------------------------------------------
// A home-screen icon made with "Add to Home screen" (a shortcut) opens in a
// browser tab, address bar and all. Chrome only fires beforeinstallprompt when
// the page is genuinely installable AND not already installed, so this bar
// appears exactly when there is something to fix, and one tap fixes it.
function showInstall() {
  if (!window.__installEvt) return;
  try { if (matchMedia("(display-mode: standalone)").matches) return; } catch (e) {}
  try { if (sessionStorage.getItem("roostNoInstall")) return; } catch (e) {}
  $("installbar").style.display = "block";
}
window.__onInstallable = showInstall;
$("doinstall").onclick = async () => {
  const e = window.__installEvt;
  if (!e) return;
  $("installbar").style.display = "none";
  e.prompt();
  try { await e.userChoice; } catch (_) {}
  window.__installEvt = null;
};
$("noinstall").onclick = () => {
  $("installbar").style.display = "none";
  try { sessionStorage.setItem("roostNoInstall", "1"); } catch (e) {}
};
window.addEventListener("appinstalled", () => {
  window.__installEvt = null;
  $("installbar").style.display = "none";
});
showInstall();

// "App status" in the footer. When the home-screen icon opens in a browser tab
// anyway, this is the phone answering for itself instead of us guessing from a
// desk: it names which of Chrome's install conditions this device actually sees.
$("diag").onclick = async e => {
  e.preventDefault();
  const box = $("diagout");
  if (box.innerHTML) { box.innerHTML = ""; return; }
  const yn = (ok, yes, no) => `<span class="v ${ok ? "y" : "n"}">${ok ? yes : no}</span>`;

  let standalone = false;
  try { standalone = matchMedia("(display-mode: standalone)").matches; } catch (_) {}
  let reg = null;
  try { reg = await navigator.serviceWorker.getRegistration(); } catch (_) {}
  let manifestOk = false, startCached = false, startUrl = "";
  try {
    const mf = await fetch("manifest.webmanifest", { cache: "no-store" }).then(r => r.json());
    manifestOk = !!(mf && mf.name && (mf.icons || []).length);
    startUrl = new URL(mf.start_url || "./", location.href).href;
    startCached = !!(await caches.match(startUrl, { ignoreSearch: true }));
  } catch (_) {}

  box.innerHTML = `<div class="card">
    <div class="row"><span class="muted">Running as</span>
      ${yn(standalone, "installed app", "browser tab")}</div>
    <div class="row"><span class="muted">Chrome offered an install</span>
      ${yn(!!window.__installEvt, "yes", "not yet")}</div>
    <div class="row"><span class="muted">Service worker</span>
      ${yn(!!(reg && reg.active), reg && reg.active ? reg.active.state : "", "none")}</div>
    <div class="row"><span class="muted">Manifest</span>
      ${yn(manifestOk, "loaded", "failed")}</div>
    <div class="row"><span class="muted">Offline copy of the start page</span>
      ${yn(startCached, "ready", "missing")}</div>
    <div class="row"><span class="muted">Build</span>
      <span class="v">${esc(document.querySelector('meta[name=build]').content)}</span></div>
    <div class="tiny" style="margin-top:8px">${standalone
      ? "This is the installed app."
      : "In Chrome: menu, Add to home screen. If that sheet offers Install, take it, "
        + "the plain shortcut is what opens with an address bar. Delete the old icon after."}</div>
  </div>`;
};

// Exposed for debugging: render any snapshot without hitting the network.
// Pure function, no data or credentials of its own. Pass a tab key to pick one.
window.roostRender = (s, accounts, tab) => renderTab(tab || TAB, s, accounts || []);
window.roostTabs = TABS.map(t => t.key);

function monthName(ym) {
  if (!ym) return "LAST MONTH";
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, (m || 1) - 1, 1)
    .toLocaleString(undefined, { month: "long" }).toUpperCase();
}

paintTabs();
</script>
